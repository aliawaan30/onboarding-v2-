<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: "Helvetica Neue", -apple-system, Arial, sans-serif; }
  .board { width:1600px; height:400px; display:flex; align-items:center; justify-content:center; gap:26px; }
  .dark  { background:#0a0f0d; }
  .light { background:#ffffff; }
  .word { font-size:96px; font-weight:800; letter-spacing:2px; }
  .dark .word { color:#ffffff; }
  .light .word { color:#0a0f0d; }
  .chip {
    display:flex; align-items:center; justify-content:center;
    width:150px; height:118px; border-radius:26px;
    background:#00d67a; color:#0a0f0d;
    font-size:82px; font-weight:900; letter-spacing:1px;
  }
  .avatar { width:400px; height:400px; border-radius:88px; background:#0a0f0d;
    display:flex; align-items:center; justify-content:center; }
  .avatar .chip { width:240px; height:190px; border-radius:44px; font-size:132px; }
</style>
<div class="board dark" id="dark">
  <span class="word">THE</span><span class="chip">AI</span><span class="word">AGENCY</span>
</div>
<div class="board light" id="light">
  <span class="word">THE</span><span class="chip">AI</span><span class="word">AGENCY</span>
</div>
<div class="avatar" id="avatar"><span class="chip">AI</span></div>
